name: prisma-deploy

on:
  push:

concurrency:
  group: prisma-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: prisma/cloud-deploy-action@v1
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          JWT_SECRET: build-only-dummy-secret
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: build-only-google-client-id
          SMTP_HOST: localhost
          SMTP_PORT: "587"
          SMTP_USER: build@example.com
          SMTP_PASSWORD: build-only-smtp-password
          SMTP_FROM: build@example.com
        with:
          build-command: npm run build